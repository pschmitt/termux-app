name: 'TermuxPP:Float'
summary: 'Termux add-on: floating terminal window'
license: GPL-3.0-only
categories:
  - System
description: |
  TermuxPP:Float shows TermuxPP terminal sessions in a floating window that stays on top of other apps and can be moved and resized.

  Part of the TermuxPP family. All TermuxPP apps share one signing key and one user ID, so they only work together: install the TermuxPP app first. Source, changes against upstream Termux and issue tracker: https://github.com/pschmitt/termuxpp

