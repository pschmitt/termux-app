name: 'TermuxPP:Widget'
summary: 'Termux add-on: home screen shortcut widget'
license: GPL-3.0-only
categories:
  - System
description: |
  TermuxPP:Widget puts shortcuts to the scripts in ~/.shortcuts on the home screen, as a widget or as individual shortcuts.

  Part of the TermuxPP family. All TermuxPP apps share one signing key and one user ID, so they only work together: install the TermuxPP app first. Source, changes against upstream Termux and issue tracker: https://github.com/pschmitt/termuxpp

