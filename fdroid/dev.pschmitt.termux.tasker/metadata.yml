name: 'TermuxPP:Tasker'
summary: 'Termux add-on: Tasker plugin'
license: GPL-3.0-only
categories:
  - System
description: |
  TermuxPP:Tasker is a Tasker, Locale and compatible automation plugin that runs TermuxPP scripts and commands from the ~/.termux/tasker directory as a task action.

  Part of the TermuxPP family. All TermuxPP apps share one signing key and one user ID, so they only work together: install the TermuxPP app first. Source, changes against upstream Termux and issue tracker: https://github.com/pschmitt/termuxpp

