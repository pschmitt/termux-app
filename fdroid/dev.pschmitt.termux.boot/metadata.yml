name: 'TermuxPP:Boot'
summary: 'Termux add-on: run scripts at device boot'
license: GPL-3.0-only
categories:
  - System
description: |
  TermuxPP:Boot runs the scripts in ~/.termux/boot in TermuxPP when the device has booted, for example to start an SSH server or a sync job. Open the app once after installing it so that Android allows it to receive the boot event.

  Part of the TermuxPP family. All TermuxPP apps share one signing key and one user ID, so they only work together: install the TermuxPP app first. Source, changes against upstream Termux and issue tracker: https://github.com/pschmitt/termuxpp

