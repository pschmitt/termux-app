name: 'TermuxPP:API'
summary: 'Termux add-on: device API access'
license: GPL-3.0-only
categories:
  - System
description: |
  TermuxPP:API lets commands run in TermuxPP use Android features: the termux-api package tools such as clipboard, notifications, sensors, location, camera, SMS, telephony and sharing. Grant the permissions each command needs in this app.

  Part of the TermuxPP family. All TermuxPP apps share one signing key and one user ID, so they only work together: install the TermuxPP app first. Source, changes against upstream Termux and issue tracker: https://github.com/pschmitt/termuxpp

